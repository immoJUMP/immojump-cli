name: CI

# Ein Workflow, drei Stufen — in dieser Reihenfolge:
#
#   test           bei jedem PR und bei jedem Push auf main (dazu
#                  test-windows: dieselben Tests auf einem Windows-Runner)
#   release-please nur auf main, erst nach grünen Tests: pflegt den Release-PR
#                  (CHANGELOG + Versions-Bump); der Merge erzeugt das Release
#   release-assets nur wenn dabei ein Release entstanden ist: hängt die
#                  Binaries an
#
# Token für release-please: bevorzugt das Secret RELEASE_PLEASE_TOKEN (PAT) —
# damit lösen Release-PRs auch die CI aus. Fallback ist GITHUB_TOKEN; der
# braucht in der Organisation "Read and write permissions" für Workflows.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint, Tests, Referenz-Abgleich
        run: make ci

  # Die Windows-Binaries gehen ans Release — also laufen die Tests auch auf
  # Windows. Lint und docs-check sind plattformunabhängig und bleiben bei
  # `test`. Der Smoke-Test prüft den Weg eines PowerShell-Nutzers: kein HOME,
  # die Konfiguration liegt unter %USERPROFILE%, und `context use` schreibt sie
  # atomar (Temp-Datei + Rename) zurück.
  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet und Tests
        run: |
          go vet ./...
          go test ./...

      - name: Smoke-Test in PowerShell (ohne HOME)
        shell: pwsh
        run: |
          go build -o immojump.exe ./cmd/immojump
          Remove-Item Env:HOME, Env:XDG_CONFIG_HOME, Env:IMMOJUMP_CONFIG -ErrorAction SilentlyContinue
          $ordner = Join-Path $env:USERPROFILE ".config\immojump"
          New-Item -ItemType Directory -Force $ordner | Out-Null
          '{"contexts":{"ci":{"base_url":"https://immojump.de","token":"x"}}}' |
            Set-Content -Encoding utf8NoBOM (Join-Path $ordner "config.json")

          .\immojump.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version endet mit Exit $LASTEXITCODE" }

          .\immojump.exe context use ci
          if ($LASTEXITCODE -ne 0) { throw "context use endet mit Exit $LASTEXITCODE" }

          $aktuell = .\immojump.exe context current | ConvertFrom-Json
          if ($aktuell.current_context -ne "ci") {
            throw "Context 'ci' aus %USERPROFILE% erwartet, bekommen: $($aktuell | ConvertTo-Json -Compress)"
          }
          Write-Host "Konfiguration gefunden und geschrieben: $($aktuell.config)"

  # Der Installationsweg ist das, was Kunden tatsaechlich benutzen — er wird
  # deshalb wirklich ausgefuehrt, nicht nur syntaktisch geprueft. Geprueft wird
  # dabei das aktuell VEROEFFENTLICHTE Release (das Skript zeigt auf "latest"),
  # nicht der Build dieses Laufs: Der Job faengt also Skriptfehler und kaputte
  # Release-Assets ab, laeuft aber bewusst neben den Release-Jobs statt vor
  # ihnen — sonst wuerde er sich selbst blockieren, solange es noch kein
  # Release gibt.
  install-script:
    name: Installationsskript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax pruefen
        run: sh -n install.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh

      - name: Verhaltenstests
        run: sh test/install_test.sh

  release-please:
    if: github.event_name == 'push'
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (exakt der Release-Tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Kein zweiter Testlauf: Derselbe Workflow-Run hat den Job `test` bereits
      # bestanden, und release-please hängt über `needs` daran. Der Tag zeigt
      # auf genau diesen Stand.
      - name: Binaries bauen
        run: make release-build VERSION=${{ needs.release-please.outputs.tag_name }}

      - name: Checksums
        run: cd dist && shasum -a 256 immojump-* > SHA256SUMS.txt

      - name: Binaries ans Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} dist/* --clobber

      # GitHub beantwortet `releases/latest/download/...` noch eine Weile mit
      # 404, nachdem das Release veroeffentlicht und die Assets hochgeladen
      # sind. Wer in dem Fenster installiert, laeuft ins Leere (beobachtet am
      # 29.08.2026 nach v0.4.0). Der Schritt verkuerzt das Fenster nicht, aber
      # er macht es sichtbar und meldet Erfolg erst, wenn der Weg, den Kunden
      # nehmen, tatsaechlich funktioniert.
      - name: Warten, bis der Download oeffentlich ausgeliefert wird
        run: |
          url="https://github.com/${{ github.repository }}/releases/latest/download/immojump-linux-amd64"
          for versuch in $(seq 1 30); do
            if curl -fsSL -o /dev/null "$url"; then
              echo "Verfuegbar nach ${versuch} Versuch(en)."
              exit 0
            fi
            echo "Noch nicht verfuegbar (Versuch ${versuch}) …"
            sleep 10
          done
          echo "::error::latest/download liefert nach fuenf Minuten noch nicht aus"
          exit 1
